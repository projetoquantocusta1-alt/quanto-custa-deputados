name: Atualizar dados

on:
  schedule:
    - cron: "17 8 * * *"   # todo dia às 05:17 (horário de Brasília)
  workflow_dispatch:        # botão "Run workflow" para rodar na hora
    inputs:
      anos:
        description: "Anos (ex.: 2019 2020). Vazio = ano atual + anos que faltam."
        required: false

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar e publicar ano a ano
        env:
          ANOS: ${{ github.event.inputs.anos }}
        run: |
          git config user.name  "robo-quanto-custa"
          git config user.email "actions@users.noreply.github.com"
          [ -z "$ANOS" ] && ANOS=$(python atualizar.py --pendentes)
          echo "Anos desta execução: $ANOS"
          inicio=$(date +%s)
          for ano in $ANOS; do
            # para com folga antes do limite de 6 h; o que faltar fica para amanhã
            if [ $(( $(date +%s) - inicio )) -gt 16200 ]; then
              echo "Tempo esgotado; $ano e seguintes ficam para a próxima execução."
              break
            fi
            python atualizar.py --anos $ano || echo "::warning::Ano $ano terminou com erro"
            mkdir -p docs/dados dados_brutos
            git add docs/dados dados_brutos
            if ! git diff --cached --quiet; then
              git commit -m "dados: $ano (atualização de $(date -u +%Y-%m-%d))"
              # tenta salvar até 5 vezes (o GitHub recusa se outro envio chegou no mesmo instante)
              for i in 1 2 3 4 5; do
                git pull --rebase -X ours origin main || true
                if git push; then break; fi
                echo "Envio recusado; nova tentativa em $((i*20)) s"; sleep $((i*20))
                [ $i = 5 ] && echo "::warning::Ano $ano não foi salvo agora; vai junto com o próximo envio"
              done
            fi
          done
